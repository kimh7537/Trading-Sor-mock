# 테스트 설정. **본 설정(src/main/resources/application.properties)을 통째로 가린다** —
# 같은 이름의 파일이 클래스패스 앞에 오기 때문이다. 그래서 필요한 값을 여기에 다시 적는다.
#
# 이 파일을 두는 이유는 하나다. 본 설정이 저장소 루트의 `.env`를 끌어오는데(spring.config.import)
# 거기에 토스 키가 있으면 **테스트를 돌리는 것만으로 바깥에 접속한다.** 실제로 그랬다 —
# 방송 테스트가 기대하지 않은 `feed-mode` 사건을 하나 더 받아 깨졌다. 그보다 나쁜 것은
# 테스트가 새 토큰을 발급해 **돌고 있던 실시세 세션을 죽인다**는 점이다(client 당 토큰이 하나).
spring.application.name=channel

# 원장 접속. 테스트는 대부분 이 값을 각자 덮어쓴다(가짜 원장의 포트).
minisor.ledger.host=127.0.0.1
minisor.ledger.port=9100
minisor.ledger.connect-timeout-ms=3000
minisor.ledger.read-timeout-ms=5000

minisor.account=123456789012
minisor.symbol=005930

# 주기 조회는 테스트가 직접 tick()을 부른다.
minisor.poller.enabled=false
minisor.poller.interval-ms=1000

# 바깥에 붙지 않는다. `.env`도 읽지 않는다.
minisor.feed.enabled=false
minisor.feed.market=0
minisor.feed.symbol=005930
minisor.feed.base-url=https://openapi.tossinvest.com
minisor.feed.ws-url=wss://openapi-ws.tossinvest.com/ws/v1
minisor.feed.client-id=
minisor.feed.client-secret=
minisor.feed.record-file=
minisor.feed.replay-file=
minisor.feed.replay-speed=1

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# 원장이 이미 다른 종목을 들고 있을 때 맞추는 물음. 테스트에는 원장이 없다.
minisor.symbol.sync-on-start=false

# 시험이 개발용 저장소를 건드리지 않게 한다 (T11-02).
#
# 처음엔 이 값이 없어 시험이 만든 가입자가 channel/minisor.db 에 남았다. 그 바람에
# 옛 users.json 이전이 "이미 사람이 있다"며 건너뛰어졌고, 실제 로그인이 막혔다.
# 시험 산출물은 target/ 밑으로 보낸다(대부분의 시험은 각자 임시 파일로 또 덮어쓴다).
minisor.db.file=target/test-minisor.db
minisor.auth.users-file=target/test-users.json
