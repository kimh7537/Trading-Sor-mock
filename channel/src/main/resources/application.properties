spring.application.name=channel

# ---------------------------------------------------------------------------
# 원장(C) 접속
# ---------------------------------------------------------------------------
# 코드에 박지 않고 여기서 읽는다. 원장은 포트 0으로도 뜨고(T3-03) 시험할 때마다
# 다른 포트를 받으므로, 박아 두면 테스트에서 갈아끼울 수가 없다(테스트는 덮어쓴다).
#
# 기본값은 원장 데몬의 기본 포트(9100)와 맞춘다. 처음엔 0이었는데 0은 "설정 안 됨"으로
# 읽혀서, 그대로 띄우면 모든 주문이 503이었다(T6-03 감사에서 발견).
minisor.ledger.host=127.0.0.1
minisor.ledger.port=9100
# 접속·읽기 제한 시간(ms). 원장이 죽어 있을 때 요청이 매달리지 않게 한다.
minisor.ledger.connect-timeout-ms=3000
minisor.ledger.read-timeout-ms=5000

# ---------------------------------------------------------------------------
# 데모 계좌와 원장 상태 방송 (T7-03)
# ---------------------------------------------------------------------------
# 원장 데몬(ledgerd)의 기본 계좌·종목과 같다. 이 채널계가 조회·취소·잔고를 부를 때 쓴다.
minisor.account=123456789012
minisor.symbol=005930
# 원장을 이 간격으로 읽어 바뀐 것(호가·잔고·주문 상태·나중 체결)만 화면에 밀어 보낸다.
# 테스트는 끄고 LedgerPoller.tick()을 직접 부른다.
minisor.poller.enabled=true
minisor.poller.interval-ms=1000

# ---------------------------------------------------------------------------
# 헬스 체크
# ---------------------------------------------------------------------------
# 필요한 것만 연다. actuator 전체를 열어 두면 운영 정보가 그대로 노출된다.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# 실시세 모드 (Phase 8)
# ---------------------------------------------------------------------------
# 키는 저장소에 올리지 않는다. 루트의 .env에서 읽고 그 파일은 .gitignore에 있다.
# 어디서 띄우든 찾도록 두 경로를 다 본다(채널계는 보통 channel/ 안에서 뜬다).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# 기본은 꺼짐. 켜도 TOSS_CLIENT_ID/SECRET이 없으면 붙지 않는다.
minisor.feed.enabled=${TOSS_ENABLED:false}
# 실호가를 심을 시장. 토스 국내 시세는 통합(KRX+NXT)이라 한 시장에만 심는다.
minisor.feed.market=0
minisor.feed.symbol=${minisor.symbol:005930}
minisor.feed.base-url=${TOSS_BASE_URL:https://openapi.tossinvest.com}
minisor.feed.ws-url=${TOSS_WS_URL:wss://openapi-ws.tossinvest.com/ws/v1}
minisor.feed.client-id=${TOSS_CLIENT_ID:}
minisor.feed.client-secret=${TOSS_CLIENT_SECRET:}
# 받은 스냅샷을 남길 파일. 비우면 남기지 않는다 (T8-06)
minisor.feed.record-file=${FEED_RECORD_FILE:}
# 재생할 파일과 배속. 장 마감·주말 데모용 (T8-06)
minisor.feed.replay-file=${FEED_REPLAY_FILE:}
minisor.feed.replay-speed=${FEED_REPLAY_SPEED:1}
